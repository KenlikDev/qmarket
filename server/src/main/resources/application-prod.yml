# Production overrides — activate with spring.profiles.active=prod
qmarket:
  seed:
    enabled: false
  security:
    jwt:
      # Required in production — app must not start with a known default secret
      secret: ${JWT_SECRET}
    cors:
      allowed-origin-patterns: ${CORS_ORIGINS:https://qmarket.example}

server:
  error:
    include-message: never
    include-binding-errors: never

spring:
  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    baseline-on-migrate: false
  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.kenlikdev.qmarket: INFO
    org.hibernate.SQL: WARN

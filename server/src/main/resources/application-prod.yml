# Production overrides — activate with spring.profiles.active=prod
qmarket:
  # Production must never fall back to the always-successful mock gateway.
  payment:
    provider: ${QMARKET_PAYMENT_PROVIDER:stripe}
  seed:
    enabled: false
  security:
    jwt:
      # Required in production — app must not start with a known default secret
      secret: ${JWT_SECRET}
    cors:
      allowed-origin-patterns: ${CORS_ORIGINS:https://qmarket.example}
    # Swagger / OpenAPI must not be anonymous in production
    api-docs-public: false

server:
  error:
    include-message: never
    include-binding-errors: never

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:?DB_HOST must be set}:${DB_PORT:5432}/${DB_NAME:qmarket}
    username: ${DB_USER:?DB_USER must be set}
    password: ${DB_PASSWORD:?DB_PASSWORD must be set}
  flyway:
    baseline-on-migrate: false
  jpa:
    show-sql: false

# Disable OpenAPI UI and docs in production (defense in depth with api-docs-public=false)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.kenlikdev.qmarket: INFO
    org.hibernate.SQL: WARN

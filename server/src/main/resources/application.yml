spring:
  application:
    name: qmarket-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:qmarket}
    username: ${DB_USER:qmarket}
    password: ${DB_PASSWORD:qmarket}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.kenlikdev.qmarket: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

qmarket:
  seed:
    # Dev/local seed (admin + demo catalog). Disable in production.
    enabled: ${QMARKET_SEED_ENABLED:true}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-to-a-very-long-and-secure-secret-key-at-least-256-bits}
      access-token-expiration-ms: 900000
      refresh-token-expiration-ms: 604800000
    cors:
      # Comma-separated origin patterns (not * in production)
      allowed-origin-patterns: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*}

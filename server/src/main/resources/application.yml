spring:
  application:
    name: qmarket-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:qmarket}
    username: ${DB_USER:qmarket}
    password: ${DB_PASSWORD:qmarket}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.kenlikdev.qmarket: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

qmarket:
  payment:
    # mock (default) | stripe
    provider: ${QMARKET_PAYMENT_PROVIDER:mock}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      api-base-url: ${STRIPE_API_BASE_URL:https://api.stripe.com}
      default-currency: ${STRIPE_DEFAULT_CURRENCY:rub}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      webhook-tolerance-seconds: ${STRIPE_WEBHOOK_TOLERANCE_SECONDS:300}
  seed:
    # Off by default (safe for accidental prod). Enable locally: QMARKET_SEED_ENABLED=true
    enabled: ${QMARKET_SEED_ENABLED:false}
  auth:
    # Failed login sliding window (per email). Successful login clears the counter.
    login-max-attempts: ${QMARKET_LOGIN_MAX_ATTEMPTS:5}
    login-window-seconds: ${QMARKET_LOGIN_WINDOW_SECONDS:300}
    login-rate-max-keys: ${QMARKET_LOGIN_RATE_MAX_KEYS:10000}
  security:
    jwt:
      # No default — set JWT_SECRET or activate profile dev/test (see application-dev.yml)
      secret: ${JWT_SECRET:}
      access-token-expiration-ms: 900000
      refresh-token-expiration-ms: 604800000
    cors:
      # Comma-separated origin patterns (not * in production)
      allowed-origin-patterns: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*}
    # When false, /swagger-ui and /api-docs require authentication (prod sets false)
    api-docs-public: ${QMARKET_API_DOCS_PUBLIC:true}
    oauth:
      google:
        enabled: ${QMARKET_GOOGLE_OAUTH_ENABLED:false}
        client-ids: []
        require-email-verified: true

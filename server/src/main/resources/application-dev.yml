# Local development — activate: spring.profiles.active=dev
# or: ./gradlew :server:bootRun --args='--spring.profiles.active=dev'
#
# Seed stays OFF by default and in prod; only this profile turns it on.
qmarket:
  seed:
    enabled: true
    admin:
      password: admin123
  security:
    jwt:
      # Local-only secret (never use in production)
      secret: dev-only-qmarket-jwt-secret-key-32chars-min

logging:
  level:
    com.kenlikdev.qmarket: DEBUG

spring:
  datasource:
    url: jdbc:tc:postgresql:17:///qmarket
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null

qmarket:
  security:
    jwt:
      secret: test-secret-key-that-is-long-enough-for-hs256-algorithm-1234567890
      access-token-expiration-ms: 3600000
      refresh-token-expiration-ms: 86400000

logging:
  level:
    root: WARN
    com.kenlikdev.qmarket: INFO

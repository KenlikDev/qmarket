spring:
  datasource:
    url: jdbc:tc:postgresql:17:///qmarket
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      # Schema from Flyway only (starter must be on classpath)
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

qmarket:
  seed:
    enabled: true
    admin:
      password: admin123
  security:
    jwt:
      secret: test-secret-key-that-is-long-enough-for-hs256-algorithm-1234567890
      access-token-expiration-ms: 3600000
      refresh-token-expiration-ms: 86400000

logging:
  level:
    root: WARN
    com.kenlikdev.qmarket: INFO
    org.flywaydb: INFO
    org.springframework.boot.flyway: INFO

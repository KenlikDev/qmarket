name: KtLint diagnostic

on:
  push:
    branches: [fix/ci-ktlint-import-order-v2]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew :server:order:ktlintFormat --no-daemon
      - run: |
          git diff -- server/order/src/main/kotlin/com/kenlikdev/qmarket/order/payment/StripeWebhookService.kt
          git diff -- server/order/src/main/kotlin/com/kenlikdev/qmarket/order/repository/StripeWebhookEventRepository.kt

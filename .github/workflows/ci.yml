name: CI

on:
  push:
    branches: [main, develop, ai/integration]
  pull_request:
    branches: [main, develop, ai/integration]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios-native-check:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Compile iOS simulator target
        run: ./gradlew :app:shared:compileKotlinIosSimulatorArm64 --no-daemon

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JWT_SECRET: ci-test-secret-key-that-is-long-enough-for-hs256-tests-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Unit + integration tests, ktlint, JaCoCo reports
        run: ./gradlew test ktlintCheck jacocoTestReport --parallel --no-daemon



      - name: JaCoCo coverage verification (order + identity)
        run: >
          ./gradlew
          :server:order:jacocoTestCoverageVerification
          :server:identity:jacocoTestCoverageVerification
          --parallel --no-daemon

      - name: Upload JaCoCo HTML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-reports
          path: |
            server/order/build/reports/jacoco/
            server/identity/build/reports/jacoco/
            server/common/build/reports/jacoco/
            server/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 14

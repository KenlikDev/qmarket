name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qmarket
          POSTGRES_USER: qmarket
          POSTGRES_PASSWORD: qmarket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qmarket -d qmarket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ci-test-secret-key-that-is-long-enough-for-hs256-tests-only
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/qmarket
      SPRING_DATASOURCE_USERNAME: qmarket
      SPRING_DATASOURCE_PASSWORD: qmarket
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Grant gradlew
        run: chmod +x gradlew
      - name: Unit + integration tests, ktlint, JaCoCo reports
        run: ./gradlew test ktlintCheck jacocoTestReport --parallel --no-daemon
      - name: Upload JaCoCo HTML (order + identity + common)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            server/order/build/reports/jacoco/
            server/identity/build/reports/jacoco/
            server/common/build/reports/jacoco/
            server/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 14

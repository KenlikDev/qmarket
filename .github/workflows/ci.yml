name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JWT_SECRET: ci-test-secret-key-that-is-long-enough-for-hs256-tests-only
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Unit + integration tests, ktlint, JaCoCo reports
        run: ./gradlew test ktlintCheck jacocoTestReport --parallel --no-daemon

      # Enforce minimum line coverage on core business modules.
      - name: JaCoCo coverage verification (order + identity)
        run: >
          ./gradlew
          :server:order:jacocoTestCoverageVerification
          :server:identity:jacocoTestCoverageVerification
          --parallel --no-daemon

      - name: Upload JaCoCo HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: |
            server/order/build/reports/jacoco/
            server/identity/build/reports/jacoco/
            server/common/build/reports/jacoco/
            server/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 14

name: CI

on:
  push:
    branches: [main, develop, ai/integration]
  pull_request:
    branches: [main, develop, ai/integration]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios-native-check:
    # Compose UIKit tests link against UIViewLayoutRegion, available in the newer Xcode SDK.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Compile iOS simulator target
        run: ./gradlew :app:shared:compileKotlinIosSimulatorArm64 --no-daemon

      - name: Run iOS Stripe payment-host recovery tests
        run: ./gradlew :app:shared:iosSimulatorArm64Test --tests com.kenlikdev.qmarket.IosStripePaymentHostTest --no-daemon

  ios-app-check:
    # Stripe iOS SDK 26.13 requires UIKit APIs from the Xcode 26 SDK.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Resolve native Stripe PaymentSheet package
        run: xcodebuild -resolvePackageDependencies -project app/iosApp/iosApp.xcodeproj -scheme iosApp

      - name: Build iOS app, Swift host, Stripe PaymentSheet and Kotlin framework
        run: >
          xcodebuild
          -project app/iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  client-platform-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Verify Stripe return secret redaction before asset requests
        run: bash scripts/check-web-stripe-return-security.sh

      - name: Run shared JVM tests and compile client targets
        # Compose UI tests run against a virtual display on the Linux runner.
        run: >
          xvfb-run -a ./gradlew
          :app:shared:jvmTest
          :app:androidApp:assembleDebug
          :app:androidApp:testDebugUnitTest
          :app:desktopApp:compileKotlin
          :app:shared:compileKotlinJs
          :app:shared:compileKotlinWasmJs
          :app:webApp:compileKotlinJs
          :app:webApp:compileKotlinWasmJs
          --parallel --no-daemon

      - name: Upload shared JVM test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shared-jvm-test-report
          path: app/shared/build/reports/tests/jvmTest/
          if-no-files-found: ignore
          retention-days: 7

  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JWT_SECRET: ci-test-secret-key-that-is-long-enough-for-hs256-tests-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Unit + integration tests, ktlint, JaCoCo reports
        run: ./gradlew test ktlintCheck jacocoTestReport --parallel --no-daemon

      - name: JaCoCo coverage verification (order + identity)
        run: >
          ./gradlew
          :server:order:jacocoTestCoverageVerification
          :server:identity:jacocoTestCoverageVerification
          --parallel --no-daemon

      - name: Upload JaCoCo HTML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-reports
          path: |
            server/order/build/reports/jacoco/
            server/identity/build/reports/jacoco/
            server/common/build/reports/jacoco/
            server/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  # The repository's branch rulesets require the "test" status context. Keep this job as the
  # aggregate required gate so a green server test cannot mask a failed client or iOS build.
  test:
    if: ${{ always() }}
    needs:
      - server-tests
      - client-platform-check
      - ios-native-check
      - ios-app-check
      - secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          SERVER_TESTS_RESULT: ${{ needs.server-tests.result }}
          CLIENT_PLATFORM_RESULT: ${{ needs.client-platform-check.result }}
          IOS_NATIVE_RESULT: ${{ needs.ios-native-check.result }}
          IOS_APP_RESULT: ${{ needs.ios-app-check.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail

          require_all_success() {
            local result
            for result in "$@"; do
              [[ "$result" == "success" ]] || return 1
            done
          }

          # Self-test the gate's fail-closed behavior for every dependency.
          require_all_success success success success success success
          for bad_result in failure cancelled skipped; do
            for index in 0 1 2 3 4; do
              simulated=(success success success success success)
              simulated[$index]="$bad_result"
              if require_all_success "${simulated[@]}"; then
                echo "::error::Aggregate gate accepted '$bad_result' for dependency index $index."
                exit 1
              fi
            done
          done

          labels=(server-tests client-platform-check ios-native-check ios-app-check secret-scan)
          actual_results=(
            "$SERVER_TESTS_RESULT"
            "$CLIENT_PLATFORM_RESULT"
            "$IOS_NATIVE_RESULT"
            "$IOS_APP_RESULT"
            "$SECRET_SCAN_RESULT"
          )
          if ! require_all_success "${actual_results[@]}"; then
            for index in "${!labels[@]}"; do
              if [[ "${actual_results[$index]}" != "success" ]]; then
                echo "::error::Job '${labels[$index]}' finished with '${actual_results[$index]}' (expected 'success')."
              fi
            done
            exit 1
          fi

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Grant gradlew
        run: chmod +x gradlew
      - name: Unit and integration tests + ktlint
        run: ./gradlew test ktlintCheck --parallel --no-daemon

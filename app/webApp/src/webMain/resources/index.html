<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>QMarket</title>
    <script>
        // Stripe may return its PaymentIntent client secret in the navigation query.
        // Remove it before stylesheets or the compiled app are requested. Keep only a
        // non-secret marker so the Kotlin app can consume the remaining result and order id.
        (() => {
            const url = new URL(window.location.href);
            const params = url.searchParams;
            if (!params.has("payment_intent_client_secret")) return;
            params.delete("payment_intent_client_secret");
            params.set("qmarketStripeReturn", "1");
            window.history.replaceState(null, document.title, `${url.pathname}${url.search}${url.hash}`);
        })();
    </script>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
    <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
    <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
            stroke-dasharray="90 125">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                          repeatCount="indefinite"/>
    </circle>
</svg>
<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
